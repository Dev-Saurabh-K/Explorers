services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: fastapi-backend
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL-}
    container_name: vite-frontend
    ports:
      - "5173:5173"
    restart: unless-stopped
    depends_on:
      - backend